openapi: "3.0.3"

info:
  title: "ORCID ACAD MGR API - Academic Module"
  description: |
    API para la gestión de académicos, categorías académicas, opciones
    de categoría y grados académicos.

    Proporciona operaciones CRUD para:
      - **Categorías Académicas** (`/academic-categories`)
      - **Opciones de Categoría** (`/category-options`)
      - **Grados Académicos** (`/degrees`)
      - **Académicos** (`/academics`)

    Todos los responses del API usan un envelope estándar:
    `{ success, code, message, timestamp, data? }`.
  version: "0.1.0"

servers:
  - url: /api
    description: API Gateway

tags:
  - name: Categorías Académicas
    description: Gestión de categorías académicas por planta
  - name: Opciones de Categoría
    description: Gestión de opciones válidas por categoría académica
  - name: Grados Académicos
    description: Gestión de grados académicos de los académicos
  - name: Académicos
    description: Gestión de académicos

paths:
  # ============================================================================
  # ACADEMIC CATEGORIES
  # ============================================================================
  /academic-categories:
    get:
      tags:
        - Categorías Académicas
      summary: Listar categorías académicas
      description: >
        Obtiene un listado de todas las categorías académicas.
        Soporta filtros opcionales por nombre y/o planta.
      operationId: listAcademicCategories
      parameters:
        - name: name
          in: query
          description: Filtro por nombre (ILIKE)
          required: false
          schema:
            type: string
            maxLength: 255
        - name: planta
          in: query
          description: Filtrar por planta
          required: false
          schema:
            $ref: "#/components/schemas/AcademicPlanta"
      responses:
        "200":
          description: Listado de categorías obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AcademicCategory"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

    post:
      tags:
        - Categorías Académicas
      summary: Crear categoría académica
      description: Crea una nueva categoría académica en el sistema.
      operationId: createAcademicCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademicCategoryDto"
      responses:
        "201":
          description: Categoría creada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicCategory"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /academic-categories/{id}:
    get:
      tags:
        - Categorías Académicas
      summary: Obtener categoría por ID
      description: Obtiene una categoría académica específica mediante su UUID.
      operationId: getAcademicCategory
      parameters:
        - name: id
          in: path
          description: UUID de la categoría académica
          required: true
          schema:
            type: string
            format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        "200":
          description: Categoría encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicCategory"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Categoría no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  # ============================================================================
  # CATEGORY OPTIONS
  # ============================================================================
  /category-options:
    get:
      tags:
        - Opciones de Categoría
      summary: Listar opciones de categoría
      description: >
        Obtiene un listado de todas las opciones de categoría académica.
        Soporta filtro opcional por categoría.
      operationId: listCategoryOptions
      parameters:
        - name: category_id
          in: query
          description: UUID de la categoría para filtrar opciones
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Listado de opciones obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AcademicCategoryOption"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

    post:
      tags:
        - Opciones de Categoría
      summary: Crear opción de categoría
      description: >
        Crea una nueva opción válida para una categoría académica.
        La combinación categoría + opción debe ser única.
      operationId: createCategoryOption
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryOptionDto"
      responses:
        "201":
          description: Opción creada exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicCategoryOption"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /category-options/{id}:
    get:
      tags:
        - Opciones de Categoría
      summary: Obtener opción por ID
      description: Obtiene una opción de categoría específica mediante su UUID.
      operationId: getCategoryOption
      parameters:
        - name: id
          in: path
          description: UUID de la opción de categoría
          required: true
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
      responses:
        "200":
          description: Opción encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicCategoryOption"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Opción no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  # ============================================================================
  # DEGREES
  # ============================================================================
  /degrees:
    post:
      tags:
        - Grados Académicos
      summary: Crear grado académico
      description: Crea un nuevo grado académico asociado a un académico.
      operationId: createDegree
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDegreeDto"
      responses:
        "201":
          description: Grado creado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Degree"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /degrees/academic/{id}:
    get:
      tags:
        - Grados Académicos
      summary: Listar grados de un académico
      description: >
        Obtiene un listado de todos los grados académicos de un académico
        específico.
      operationId: listDegreesByAcademic
      parameters:
        - name: id
          in: path
          description: UUID del académico
          required: true
          schema:
            type: string
            format: uuid
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
      responses:
        "200":
          description: Listado de grados obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Degree"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Académico no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /degrees/{id}:
    patch:
      tags:
        - Grados Académicos
      summary: Actualizar grado académico
      description: >
        Actualiza uno o más campos de un grado académico existente.
        Solo se actualizan los campos proporcionados en el cuerpo
        de la solicitud (PATCH parcial).
      operationId: updateDegree
      parameters:
        - name: id
          in: path
          description: UUID del grado académico
          required: true
          schema:
            type: string
            format: uuid
          example: d4e5f6a7-b8c9-0123-def4-567890123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDegreeDto"
      responses:
        "200":
          description: Grado actualizado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Degree"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Grado no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  # ============================================================================
  # ACADEMICS
  # ============================================================================
  /academics:
    get:
      tags:
        - Académicos
      summary: Listar académicos
      description: >
        Obtiene un listado detallado de todos los académicos con sus datos
        resueltos (departamento, carrera, categoría, opción, planta,
        nacionalidad, puesto de trabajo). Soporta búsqueda por texto y
        filtros por departamento, carrera, categoría, planta y opción.
      operationId: listAcademics
      parameters:
        - name: search
          in: query
          description: >
            Búsqueda por RUT, nombres, apellidos o email (ILIKE).
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: careerId
          in: query
          description: Filtrar por carrera (UUID)
          required: false
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          description: Filtrar por departamento (UUID)
          required: false
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          description: Filtrar por categoría académica (UUID)
          required: false
          schema:
            type: string
            format: uuid
        - name: planta
          in: query
          description: Filtrar por tipo de planta
          required: false
          schema:
            $ref: "#/components/schemas/AcademicPlanta"
        - name: option
          in: query
          description: Filtrar por opción académica
          required: false
          schema:
            $ref: "#/components/schemas/AcademicOption"
        - name: includeUnlinked
          in: query
          description: >
            Incluir académicos desvinculados en el listado. Por defecto
            (false) solo se listan los activos.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Listado de académicos obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AcademicView"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

    post:
      tags:
        - Académicos
      summary: Crear académico
      description: >
        Crea un nuevo académico en el sistema con todos sus datos
        personales, laborales y de categorización académica.
      operationId: createAcademic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademicDto"
      responses:
        "201":
          description: Académico creado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicView"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /academics/public:
    get:
      tags:
        - Académicos
      summary: Listar académicos (público)
      description: >
        Obtiene un listado público de académicos sin datos laborales
        sensibles (categoría, JCE, horas, etc.). Soporta los mismos
        filtros que el listado interno.
      operationId: listPublicAcademics
      parameters:
        - name: search
          in: query
          description: >
            Búsqueda por RUT, nombres, apellidos o email (ILIKE).
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: careerId
          in: query
          description: Filtrar por carrera (UUID)
          required: false
          schema:
            type: string
            format: uuid
        - name: departmentId
          in: query
          description: Filtrar por departamento (UUID)
          required: false
          schema:
            type: string
            format: uuid
        - name: categoryId
          in: query
          description: Filtrar por categoría académica (UUID)
          required: false
          schema:
            type: string
            format: uuid
        - name: planta
          in: query
          description: Filtrar por tipo de planta
          required: false
          schema:
            $ref: "#/components/schemas/AcademicPlanta"
        - name: option
          in: query
          description: Filtrar por opción académica
          required: false
          schema:
            $ref: "#/components/schemas/AcademicOption"
      responses:
        "200":
          description: Listado de académicos obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AcademicPublicView"

  /academics/public/{id}:
    get:
      tags:
        - Académicos
      summary: Obtener académico público por ID
      description: >
        Obtiene un académico específico con datos públicos (sin datos
        laborales sensibles).
      operationId: getPublicAcademic
      parameters:
        - name: id
          in: path
          description: UUID del académico
          required: true
          schema:
            type: string
            format: uuid
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
      responses:
        "200":
          description: Académico encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicPublicView"
        "404":
          description: Académico no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /academics/{id}:
    get:
      tags:
        - Académicos
      summary: Obtener académico por ID
      description: >
        Obtiene un académico específico con todos sus datos resueltos
        (departamento, carrera, categoría, etc.).
      operationId: getAcademic
      parameters:
        - name: id
          in: path
          description: UUID del académico
          required: true
          schema:
            type: string
            format: uuid
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
      responses:
        "200":
          description: Académico encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicView"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Académico no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

    patch:
      tags:
        - Académicos
      summary: Actualizar académico
      description: >
        Actualiza uno o más campos de un académico existente. Solo se
        actualizan los campos proporcionados (PATCH parcial).
      operationId: updateAcademic
      parameters:
        - name: id
          in: path
          description: UUID del académico
          required: true
          schema:
            type: string
            format: uuid
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAcademicDto"
      responses:
        "200":
          description: Académico actualizado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicView"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Académico no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /academics/{id}/unlink:
    post:
      tags:
        - Académicos
      summary: Desvincular académico
      description: >
        Marca al académico como desvinculado de la universidad (soft delete).
        Sus publicaciones se conservan y siguen contando para el período en
        que estuvo vinculado, desde su fecha de ingreso hasta la fecha de
        desvinculación. A partir de la desvinculación deja de contar para la
        JCE.
      operationId: unlinkAcademic
      parameters:
        - name: id
          in: path
          description: UUID del académico
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Académico desvinculado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicView"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Académico no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El académico ya está desvinculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /academics/{id}/update-profile-request:
    post:
      tags:
        - Académicos
      summary: Solicitar actualización de perfil
      description: >
        Solicita que un académico actualice su perfil mediante un link
        enviado por correo. Requiere el código de autorización asociado.
      operationId: updateAcademicProfileRequest
      parameters:
        - name: id
          in: path
          description: UUID del académico
          required: true
          schema:
            type: string
            format: uuid
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequestDto"
      responses:
        "200":
          description: Solicitud procesada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicView"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Académico no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /academics/{id}/edit-codes/send:
    post:
      tags:
        - Académicos
      summary: Enviar códigos de edición
      description: >
        Envía por correo los códigos de autorización que permiten a un
        académico editar su perfil.
      operationId: sendAcademicEditCodes
      parameters:
        - name: id
          in: path
          description: UUID del académico
          required: true
          schema:
            type: string
            format: uuid
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
      responses:
        "200":
          description: Códigos enviados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicView"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Académico no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /academics/edit-codes/mass:
    post:
      tags:
        - Académicos
      summary: Enviar códigos de edición masivos
      description: >
        Envía por correo los códigos de autorización a todos los académicos.
        Retorna la cantidad de correos enviados.
      operationId: sendEditCodesMass
      responses:
        "200":
          description: Códigos enviados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: integer
                        description: Cantidad de correos enviados
                        example: 120
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /academics/import:
    post:
      tags:
        - Académicos
      summary: Importar académicos desde CSV
      description: >
        Importa académicos masivamente desde un archivo CSV.
        Cada fila se procesa como una operación independiente.
        Retorna la cantidad de filas importadas, actualizadas y los errores
        por fila.
      operationId: importAcademics
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo CSV con los datos de los académicos
      responses:
        "200":
          description: Importación completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ImportResult"
        "400":
          description: Error al procesar el archivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  /academics/profile/update/validate:
    post:
      tags:
        - Académicos
      summary: Validar token de actualización de perfil
      description: >
        Valida un token de un solo uso y retorna los datos públicos del
        académico asociado.
      operationId: validateProfileUpdateToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateTokenDto"
      responses:
        "200":
          description: Token válido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicPublicView"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /academics/profile/update:
    post:
      tags:
        - Académicos
      summary: Actualizar perfil mediante token
      description: >
        Actualiza el perfil de un académico usando un token de un solo uso.
        Solo se actualizan los campos proporcionados.
      operationId: updateProfileFromToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CombinedSelfUpdateDto"
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AcademicView"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /academics/profile/update/sync-works:
    post:
      tags:
        - Académicos
      summary: Sincronizar obras mediante token
      description: >
        Sincroniza las obras de un académico desde ORCID/OpenAlex usando un
        token de un solo uso. Retorna el resumen de la sincronización.
      operationId: syncWorksByToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncByTokenDto"
      responses:
        "200":
          description: Sincronización completada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/SyncResultView"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /academics/profile/update/works/{id}/overrides:
    put:
      tags:
        - Académicos
      summary: Actualizar overrides de una publicación (autor)
      description: >
        Actualiza los overrides (campos corregidos) de una publicación usando
        un token de un solo uso. Solo el académico que es autor local de la
        publicación puede editarla. El valor `null` limpia el override; la
        ausencia del campo no modifica nada.
      operationId: updateWorkOverridesByToken
      parameters:
        - name: id
          in: path
          description: UUID del work
          required: true
          schema:
            type: string
            format: uuid
          example: f1a2b3c4-d5e6-7890-1234-abcdefabcdef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkOverridesByTokenDto"
      responses:
        "200":
          description: Overrides actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El académico no es autor de la publicación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Publicación no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags:
        - Académicos
      summary: Limpiar overrides de una publicación (autor)
      description: >
        Elimina todos los overrides de una publicación usando un token de un
        solo uso. Solo el académico que es autor local de la publicación
        puede editarla.
      operationId: clearWorkOverridesByToken
      parameters:
        - name: id
          in: path
          description: UUID del work
          required: true
          schema:
            type: string
            format: uuid
          example: f1a2b3c4-d5e6-7890-1234-abcdefabcdef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateTokenDto"
      responses:
        "200":
          description: Overrides eliminados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El académico no es autor de la publicación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Publicación no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /academics/profile/update/works/{id}/authorships/{orcid}/affiliations:
    put:
      tags:
        - Académicos
      summary: Actualizar afiliaciones de una autoría (autor)
      description: >
        Actualiza las afiliaciones de una autoría específica de una publicación
        usando un token de un solo uso. Solo el académico que es autor local
        de la publicación puede editarla.
      operationId: updateAuthorshipAffiliationsByToken
      parameters:
        - name: id
          in: path
          description: UUID del work
          required: true
          schema:
            type: string
            format: uuid
          example: f1a2b3c4-d5e6-7890-1234-abcdefabcdef
        - name: orcid
          in: path
          description: ORCID de la autoría (XXXXXXXX-XXXX-XXXX-XXXX)
          required: true
          schema:
            type: string
          example: "0000-0002-1234-5678"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffiliationsByTokenDto"
      responses:
        "200":
          description: Afiliaciones actualizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El académico no es autor de la publicación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Publicación no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: ACAD_MGR_ACCESS_TOKEN
      description: >
        Cookie HTTP-only que contiene el JWT de acceso.
        Se obtiene automáticamente al iniciar sesión.

  schemas:
    # ==========================================================================
    # ENUMS
    # ==========================================================================
    AcademicPlanta:
      description: Tipo de planta académica
      type: string
      enum:
        - adjunta
        - permanente
      example: permanente

    AcademicOption:
      description: Opción académica (docencia/investigación)
      type: string
      enum:
        - teaching
        - research
      example: teaching

    DegreeKind:
      description: Tipo de grado académico
      type: string
      enum:
        - professional
        - magister
        - doctor
      example: magister

    Sex:
      description: Sexo del académico
      type: string
      enum:
        - H
        - M
        - O
      example: H

    # ==========================================================================
    # ACADEMIC CATEGORY
    # ==========================================================================
    AcademicCategory:
      description: "Representa una categoría académica (ej: Profesor Titular)"
      type: object
      required:
        - id
        - name
        - planta
      properties:
        id:
          type: string
          format: uuid
          description: UUID único generado automáticamente
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          description: Nombre de la categoría
          minLength: 1
          maxLength: 255
          example: Profesor Titular
        planta:
          $ref: "#/components/schemas/AcademicPlanta"

    CreateAcademicCategoryDto:
      description: Datos de entrada para crear una categoría académica
      type: object
      required:
        - name
        - planta
      properties:
        name:
          type: string
          description: Nombre de la categoría
          minLength: 1
          maxLength: 255
          example: Profesor Titular
        planta:
          $ref: "#/components/schemas/AcademicPlanta"

    # ==========================================================================
    # ACADEMIC CATEGORY OPTION
    # ==========================================================================
    AcademicCategoryOption:
      description: Representa una opción válida para una categoría académica
      type: object
      required:
        - id
        - categoryId
        - option
      properties:
        id:
          type: string
          format: uuid
          description: UUID único generado automáticamente
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        categoryId:
          type: string
          format: uuid
          description: UUID de la categoría académica asociada
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        option:
          $ref: "#/components/schemas/AcademicOption"
        hours:
          type: number
          format: double
          nullable: true
          description: Horas asignadas a esta opción (puede estar vacío si no están definidas)
          example: 12

    CreateCategoryOptionDto:
      description: Datos de entrada para crear una opción de categoría
      type: object
      required:
        - categoryId
        - option
      properties:
        categoryId:
          type: string
          format: uuid
          description: UUID de la categoría académica
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        option:
          $ref: "#/components/schemas/AcademicOption"
        hours:
          type: number
          format: double
          nullable: true
          description: Horas asignadas a esta opción (opcional)
          example: 12

    # ==========================================================================
    # DEGREE
    # ==========================================================================
    Degree:
      description: Representa un grado académico obtenido por un académico
      type: object
      required:
        - id
        - academicId
        - name
        - university
        - obtainedAt
        - kind
        - countryCode
      properties:
        id:
          type: string
          format: uuid
          description: UUID único generado automáticamente
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        academicId:
          type: string
          format: uuid
          description: UUID del académico al que pertenece
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
        name:
          type: string
          description: Nombre del grado obtenido
          minLength: 1
          maxLength: 255
          example: Licenciatura en Ciencias de la Computación
        university:
          type: string
          description: Universidad que otorgó el grado
          minLength: 1
          maxLength: 255
          example: Universidad Católica de Temuco
        obtainedAt:
          type: string
          format: date
          description: Fecha de obtención del grado
          example: "2015-12-15"
        kind:
          $ref: "#/components/schemas/DegreeKind"
        countryCode:
          type: string
          description: Código ISO 3166-1 alpha-2 del país
          minLength: 2
          maxLength: 2
          example: CL

    CreateDegreeDto:
      description: Datos de entrada para crear un grado académico
      type: object
      required:
        - academicId
        - name
        - university
        - obtainedAt
        - kind
        - countryCode
      properties:
        academicId:
          type: string
          format: uuid
          description: UUID del académico
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
        name:
          type: string
          description: Nombre del grado
          minLength: 1
          maxLength: 255
          example: Magíster en Ciencias
        university:
          type: string
          description: Universidad que otorga el grado
          minLength: 1
          maxLength: 255
          example: Universidad Católica de Temuco
        obtainedAt:
          type: string
          format: date
          description: Fecha de obtención
          example: "2020-06-30"
        kind:
          $ref: "#/components/schemas/DegreeKind"
        countryCode:
          type: string
          description: Código ISO 3166-1 alpha-2 del país
          minLength: 2
          maxLength: 2
          example: CL

    UpdateDegreeDto:
      description: >
        Datos de entrada para actualizar parcialmente un grado académico.
        Todos los campos son opcionales; solo se actualizan los campos
        proporcionados.
      type: object
      properties:
        name:
          type: string
          description: Nombre del grado
          minLength: 1
          maxLength: 255
          example: Magíster en Ciencias
        university:
          type: string
          description: Universidad que otorga el grado
          minLength: 1
          maxLength: 255
          example: Universidad Católica de Temuco
        obtainedAt:
          type: string
          format: date
          description: Fecha de obtención
          example: "2020-06-30"
        countryCode:
          type: string
          description: Código ISO 3166-1 alpha-2 del país
          minLength: 2
          maxLength: 2
          example: CL
        kind:
          $ref: "#/components/schemas/DegreeKind"

    # ==========================================================================
    # ACADEMIC VIEW
    # ==========================================================================
    AcademicView:
      description: >
        Vista detallada de un académico con todos los datos resueltos.
        Los identificadores se presentan como nombres legibles
        (departamento, carrera, categoría, planta, opción,
        nacionalidad, puesto de trabajo).
      type: object
      required:
        - id
        - names
        - paternalSurname
        - maternalSurname
        - email
        - sex
        - birthDate
        - joinedAt
        - department
        - jce
        - category
        - planta
        - option
        - annualDiscountHours
        - nationality
        - city
      properties:
        id:
          type: string
          format: uuid
          description: UUID único del académico
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
        names:
          type: string
          description: Nombres del académico
          example: Juan Carlos
        paternalSurname:
          type: string
          description: Apellido paterno
          example: López
        maternalSurname:
          type: string
          description: Apellido materno
          example: Martínez
        email:
          type: string
          format: email
          description: Correo electrónico institucional
          example: jlopez@uct.cl
        orcid:
          type: string
          description: ORCID ID (URL https://orcid.org/XXXX-XXXX-XXXX-XXXX)
          nullable: true
          example: "https://orcid.org/0000-0002-1234-5678"
        sex:
          $ref: "#/components/schemas/Sex"
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento
          example: "1980-03-15"
        joinedAt:
          type: string
          format: date
          description: Fecha de ingreso a la universidad
          example: "2010-05-01"
        leftAt:
          type: string
          format: date
          nullable: true
          description: >
            Fecha de desvinculación de la universidad. `null` si el académico
            sigue activo. Las publicaciones se atribuyen solo dentro del
            período [joinedAt, leftAt].
          example: "2026-09-12"
        workPosition:
          type: string
          description: Nombre del cargo laboral
          nullable: true
          example: Docente
        department:
          type: string
          description: Nombre del departamento al que pertenece
          example: Ciencias Matemáticas y Físicas
        career:
          type: string
          description: Nombre de la carrera asociada
          nullable: true
          example: Ingeniería Civil en Informática
        jce:
          type: number
          format: double
          description: Jornada de trabajo (0.0 a 1.0)
          minimum: 0
          maximum: 1
          example: 0.5
        category:
          type: string
          description: Nombre de la categoría académica
          example: Profesor Titular
        planta:
          $ref: "#/components/schemas/AcademicPlanta"
        option:
          $ref: "#/components/schemas/AcademicOption"
        acadCategoryHours:
          type: number
          format: double
          nullable: true
          description: Horas dedicadas a la categoría académica
          example: 40.0
        annualDiscountHours:
          type: number
          format: double
          description: Horas de descuento anuales
          example: 120.0
        nationality:
          type: string
          description: Nombre del país de nacionalidad
          example: Chile
        city:
          type: string
          description: Ciudad de residencia
          example: Temuco

    AcademicPublicView:
      description: >
        Vista pública de un académico sin datos laborales sensibles
        (categoría, JCE, horas, etc.).
      type: object
      required:
        - id
        - names
        - paternalSurname
        - maternalSurname
        - email
        - sex
        - birthDate
        - joinedAt
        - department
        - nationality
        - city
      properties:
        id:
          type: string
          format: uuid
          description: UUID único del académico
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
        names:
          type: string
          description: Nombres del académico
          example: Juan Carlos
        paternalSurname:
          type: string
          description: Apellido paterno
          example: López
        maternalSurname:
          type: string
          description: Apellido materno
          example: Martínez
        email:
          type: string
          format: email
          description: Correo electrónico institucional
          example: jlopez@uct.cl
        orcid:
          type: string
          description: ORCID ID (URL https://orcid.org/XXXX-XXXX-XXXX-XXXX)
          nullable: true
          example: "https://orcid.org/0000-0002-1234-5678"
        sex:
          $ref: "#/components/schemas/Sex"
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento
          example: "1980-03-15"
        joinedAt:
          type: string
          format: date
          description: Fecha de ingreso a la universidad
          example: "2010-05-01"
        department:
          type: string
          description: Nombre del departamento al que pertenece
          example: Ciencias Matemáticas y Físicas
        career:
          type: string
          description: Nombre de la carrera asociada
          nullable: true
          example: Ingeniería Civil en Informática
        nationality:
          type: string
          description: Nombre del país de nacionalidad
          example: Chile
        city:
          type: string
          description: Ciudad de residencia
          example: Temuco

    # ==========================================================================
    # CREATE ACADEMIC DTO
    # ==========================================================================
    CreateAcademicDto:
      description: Datos de entrada para crear un académico
      type: object
      required:
        - rut
        - names
        - paternalSurname
        - maternalSurname
        - email
        - sex
        - birthDate
        - joinedAt
        - workPositionId
        - departmentId
        - acadCategoryOptionsId
        - jce
        - annualDiscountHours
        - nationalityCode
        - city
      properties:
        rut:
          type: string
          description: "RUT del académico (formato: XXXXXXXX-X)"
          pattern: '^\d{7,8}-[\dkK]$'
          example: "12345678-9"
        names:
          type: string
          description: Nombres del académico
          minLength: 1
          maxLength: 255
          example: Juan Carlos
        paternalSurname:
          type: string
          description: Apellido paterno
          minLength: 1
          maxLength: 255
          example: López
        maternalSurname:
          type: string
          description: Apellido materno
          minLength: 1
          maxLength: 255
          example: Martínez
        email:
          type: string
          format: email
          description: Correo electrónico institucional
          example: jlopez@uct.cl
        orcid:
          type: string
          description: >
            ORCID ID como URL completa: https://orcid.org/XXXX-XXXX-XXXX-XXXX
          nullable: true
          pattern: '^https://orcid\.org/\d{4}-\d{4}-\d{4}-\d{3}[\dX]$'
          example: "https://orcid.org/0000-0002-1234-5678"
        sex:
          $ref: "#/components/schemas/Sex"
        birthDate:
          type: string
          format: date
          description: "Fecha de nacimiento (no puede ser futura)"
          example: "1980-03-15"
        joinedAt:
          type: string
          format: date
          description: >
            Fecha de ingreso a la universidad. No puede ser futura
            ni anterior a la fundación de la UCT (1959-09-08).
          example: "2010-05-01"
        workPositionId:
          type: string
          format: uuid
          description: UUID de un cargo laboral existente
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        departmentId:
          type: string
          format: uuid
          description: UUID del departamento al que pertenece
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        careerId:
          type: string
          format: uuid
          description: UUID de la carrera asociada (opcional)
          nullable: true
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        jce:
          type: number
          format: double
          description: Jornada de trabajo (0.0 a 1.0)
          minimum: 0
          maximum: 1
          example: 0.5
        acadCategoryOptionsId:
          type: string
          format: uuid
          description: UUID de la opción de categoría académica
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        annualDiscountHours:
          type: number
          format: double
          description: Horas de descuento anuales
          minimum: 0
          example: 120.0
        nationalityCode:
          type: string
          description: Código ISO 3166-1 alpha-2 del país de nacionalidad
          minLength: 2
          maxLength: 2
          example: CL
        city:
          type: string
          description: Ciudad de residencia
          minLength: 1
          maxLength: 255
          example: Temuco

    # ==========================================================================
    # UPDATE ACADEMIC DTO
    # ==========================================================================
    UpdateAcademicDto:
      description: >
        Datos de entrada para actualizar parcialmente un académico. Todos
        los campos son opcionales; solo se actualizan los proporcionados.
      type: object
      properties:
        names:
          type: string
          description: Nombres del académico
          minLength: 1
          maxLength: 255
          example: Juan Carlos
        paternalSurname:
          type: string
          description: Apellido paterno
          minLength: 1
          maxLength: 255
          example: López
        maternalSurname:
          type: string
          description: Apellido materno
          minLength: 1
          maxLength: 255
          example: Martínez
        orcid:
          type: string
          description: >
            ORCID ID como URL completa: https://orcid.org/XXXX-XXXX-XXXX-XXXX
          nullable: true
          pattern: '^https://orcid\.org/\d{4}-\d{4}-\d{4}-\d{3}[\dX]$'
          example: "https://orcid.org/0000-0002-1234-5678"
        sex:
          $ref: "#/components/schemas/Sex"
        birthDate:
          type: string
          format: date
          description: "Fecha de nacimiento (no puede ser futura)"
          example: "1980-03-15"
        joinedAt:
          type: string
          format: date
          description: >
            Fecha de ingreso a la universidad. No puede ser futura
            ni anterior a la fundación de la UCT (1959-09-08).
          example: "2010-05-01"
        workPositionId:
          type: string
          format: uuid
          description: UUID de un cargo laboral existente
          nullable: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        departmentId:
          type: string
          format: uuid
          description: UUID del departamento al que pertenece
          nullable: true
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        careerId:
          type: string
          format: uuid
          description: UUID de la carrera asociada
          nullable: true
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        acadCategoryOptionsId:
          type: string
          format: uuid
          description: UUID de la opción de categoría académica
          nullable: true
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        jce:
          type: number
          format: double
          description: Jornada de trabajo (0.0 a 1.0)
          minimum: 0
          maximum: 1
          example: 0.5
        annualDiscountHours:
          type: number
          format: double
          description: Horas de descuento anuales
          minimum: 0
          example: 120.0
        nationalityCode:
          type: string
          description: Código ISO 3166-1 alpha-2 del país de nacionalidad
          minLength: 2
          maxLength: 2
          example: CL
        city:
          type: string
          description: Ciudad de residencia
          minLength: 1
          maxLength: 255
          example: Temuco

    # ==========================================================================
    # SELF UPDATE ACADEMIC DTO
    # ==========================================================================
    SelfUpdateAcademicDto:
      description: >
        Datos que un académico puede actualizar sobre su propio perfil
        mediante un link de un solo uso. Todos los campos son opcionales.
      type: object
      properties:
        names:
          type: string
          description: Nombres del académico
          minLength: 1
          maxLength: 255
          example: Juan Carlos
        paternalSurname:
          type: string
          description: Apellido paterno
          minLength: 1
          maxLength: 255
          example: López
        maternalSurname:
          type: string
          description: Apellido materno
          minLength: 1
          maxLength: 255
          example: Martínez
        orcid:
          type: string
          description: >
            ORCID ID como URL completa: https://orcid.org/XXXX-XXXX-XXXX-XXXX
          nullable: true
          pattern: '^https://orcid\.org/\d{4}-\d{4}-\d{4}-\d{3}[\dX]$'
          example: "https://orcid.org/0000-0002-1234-5678"
        sex:
          $ref: "#/components/schemas/Sex"
        birthDate:
          type: string
          format: date
          description: "Fecha de nacimiento (no puede ser futura)"
          example: "1980-03-15"
        nationalityCode:
          type: string
          description: Código ISO 3166-1 alpha-2 del país de nacionalidad
          minLength: 2
          maxLength: 2
          example: CL
        city:
          type: string
          description: Ciudad de residencia
          minLength: 1
          maxLength: 255
          example: Temuco

    # ==========================================================================
    # TOKEN DTOs
    # ==========================================================================
    ValidateTokenDto:
      description: Token de un solo uso para validación de perfil
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Token de un solo uso
          minLength: 1
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8

    ProfileUpdateRequestDto:
      description: Código de autorización para solicitar actualización de perfil
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Código de autorización
          minLength: 1
          example: "A1B2C3D4"

    SyncByTokenDto:
      description: Token de un solo uso para sincronización de obras
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Token de un solo uso
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8

    CombinedSelfUpdateDto:
      description: >
        Token de un solo uso junto con los datos a actualizar del perfil.
      type: object
      required:
        - token
        - data
      properties:
        token:
          type: string
          description: Token de un solo uso
          minLength: 1
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
        data:
          $ref: "#/components/schemas/SelfUpdateAcademicDto"

    WorkOverridesByTokenDto:
      description: >
        Token de un solo uso junto con los overrides a aplicar a una
        publicación. Cada campo usa la semántica de doble opción: si no se
        envía, no se modifica; si se envía como `null`, el override se limpia;
        si se envía un valor, se asigna.
      type: object
      required:
        - token
        - data
      properties:
        token:
          type: string
          description: Token de un solo uso
          minLength: 1
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
        data:
          type: object
          description: Overrides a aplicar sobre la publicación
          properties:
            title:
              type: string
              nullable: true
              description: Nuevo título o `null` para limpiar
            abstractText:
              type: string
              nullable: true
              description: Nuevo resumen o `null` para limpiar
            doi:
              type: string
              nullable: true
              description: Nuevo DOI o `null` para limpiar
            publicationYear:
              type: integer
              nullable: true
              description: Nuevo año o `null` para limpiar
            isAccepted:
              type: boolean
              nullable: true
              description: Nuevo estado o `null` para limpiar
            isPublished:
              type: boolean
              nullable: true
              description: Nuevo estado o `null` para limpiar
            researchLineId:
              type: string
              format: uuid
              nullable: true
              description: Nueva línea de investigación o `null` para limpiar
            correspondingOrcid:
              type: string
              nullable: true
              description: Nuevo ORCID de correspondencia o `null` para limpiar
            journalKind:
              type: string
              nullable: true
              description: Nueva indexación forzada o `null` para limpiar (vuelve a la derivada por ISSN)
              enum:
                - wos
                - scopus

    AffiliationsByTokenDto:
      description: >
        Token de un solo uso junto con las afiliaciones de una autoría a
        actualizar.
      type: object
      required:
        - token
        - affiliations
      properties:
        token:
          type: string
          description: Token de un solo uso
          minLength: 1
          example: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
        affiliations:
          type: array
          description: Lista de afiliaciones de la autoría
          items:
            type: string
          example:
            - "Universidad Católica de Temuco"
            - "Universidad de Chile"

    # ==========================================================================
    # IMPORT RESULT
    # ==========================================================================
    ImportResult:
      description: Resultado de la importación masiva de académicos
      type: object
      required:
        - imported
        - updated
        - errors
      properties:
        imported:
          type: integer
          description: Cantidad de académicos importados exitosamente
          example: 95
        updated:
          type: integer
          description: Cantidad de académicos actualizados exitosamente
          example: 12
        errors:
          type: array
          description: Errores ocurridos durante la importación
          items:
            $ref: "#/components/schemas/ImportRowError"

    ImportRowError:
      description: Error en una fila específica durante la importación CSV
      type: object
      required:
        - row
        - reasons
      properties:
        row:
          type: integer
          description: Número de fila en el CSV donde ocurrió el error
          example: 45
        reasons:
          type: array
          description: Lista de mensajes de error para la fila
          items:
            type: string
          example:
            - "Departamento 'Inexistente' no encontrado"

    # ==========================================================================
    # SYNC RESULT VIEW (duplicado desde research para uso en academics)
    # ==========================================================================
    SyncResultView:
      description: Resumen del resultado de la sincronización de obras
      type: object
      required:
        - academicId
        - orcidWorks
        - worksWithoutDoi
        - notFoundInOpenalex
        - worksCreated
        - authorshipsInserted
        - authorshipsUnlinked
        - topicsLinked
        - keywordsLinked
        - errors
      properties:
        academicId:
          type: string
          format: uuid
          description: UUID del académico sincronizado
          example: e5f6a7b8-c9d0-1234-ef56-789012345678
        orcidWorks:
          type: integer
          description: Cantidad de obras encontradas en ORCID
          example: 24
        worksWithoutDoi:
          type: integer
          description: Obras sin DOI (no buscadas en OpenAlex)
          example: 2
        notFoundInOpenalex:
          type: integer
          description: Obras no encontradas en OpenAlex
          example: 1
        worksCreated:
          type: integer
          description: Obras creadas en el sistema
          example: 21
        authorshipsInserted:
          type: integer
          description: Autorías insertadas
          example: 21
        authorshipsUnlinked:
          type: integer
          description: Autorías desvinculadas
          example: 0
        topicsLinked:
          type: integer
          description: Tópicos vinculados
          example: 18
        keywordsLinked:
          type: integer
          description: Palabras clave vinculadas
          example: 15
        errors:
          type: array
          description: Errores ocurridos durante la sincronización
          items:
            type: string

    # ==========================================================================
    # COMMON RESPONSE ENVELOPE
    # ==========================================================================
    ApiResponse:
      description: Envelope estándar de respuesta del API
      type: object
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
          example: true
        code:
          type: integer
          description: Código de estado HTTP
          example: 200
        message:
          type: string
          description: Mensaje descriptivo de la operación
          example: "OK"
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo de la respuesta (RFC3339)
          example: "2026-06-21T18:45:00Z"

    # ==========================================================================
    # COMMON ERROR SCHEMAS
    # ==========================================================================
    ErrorResponse:
      description: Error estándar del API
      type: object
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          description: Código de estado HTTP
          example: 404
        message:
          type: string
          description: Mensaje descriptivo del error
          example: "Académico no encontrado"
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo de la respuesta (RFC3339)
          example: "2026-06-21T18:45:00Z"
        error:
          description: Detalle adicional del error (opcional)
          example: "Not Found"

    ValidationError:
      description: Error de validación en los datos de entrada
      type: object
      required:
        - success
        - code
        - message
        - timestamp
        - errors
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          description: Código de estado HTTP
          example: 400
        message:
          type: string
          description: Mensaje de error general
          example: "Validation error"
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo de la respuesta (RFC3339)
          example: "2026-06-21T18:45:00Z"
        errors:
          type: object
          description: Errores de validación agrupados por campo
          additionalProperties:
            type: array
            items:
              type: object
              required:
                - code
                - message
              properties:
                code:
                  type: string
                  description: Código del error de validación
                  example: regex
                message:
                  type: string
                  description: Descripción del error de validación
                  example: "El RUT debe tener el formato XXXXXXXX-X"