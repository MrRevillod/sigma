openapi: "3.0.3"

info:
  title: "ORCID ACAD MGR API - Auth Module"
  description: |
    API de autenticación y gestión de usuarios del sistema.

    Proporciona operaciones de:
      - **Autenticación** (`/auth/login`, `/auth/refresh`, `/auth/logout`, `/auth/forgot-password`, `/auth/reset-password`)
      - **Usuarios** (`/users`)

    La autenticación se realiza mediante cookies HTTP-only con JWT.
    El access token (`ACAD_MGR_ACCESS_TOKEN`) tiene corta duración y se renueva
    mediante el refresh token (`ACAD_MGR_REFRESH_TOKEN`).

    Todos los responses del API usan un envelope estándar:
    `{ success, code, message, timestamp, data? }`. En este módulo los tokens
    **no** viajan en el cuerpo: se almacenan en cookies HTTP-only.
  version: "0.1.0"

servers:
  - url: /api
    description: API Gateway

tags:
  - name: Autenticación
    description: Inicio de sesión, renovación y cierre de sesión
  - name: Usuarios
    description: Gestión de usuarios del sistema

paths:
  # ============================================================================
  # AUTH - LOGIN
  # ============================================================================
  /auth/login:
    post:
      tags:
        - Autenticación
      summary: Iniciar sesión
      description: >
        Autentica un usuario con email y contraseña. Retorna los datos del
        usuario en el cuerpo; el access token y refresh token se almacenan
        automáticamente en cookies HTTP-only.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserView"
          headers:
            Set-Cookie:
              description: >
                Cookies `ACAD_MGR_ACCESS_TOKEN` (JWT de acceso, corto plazo)
                y `ACAD_MGR_REFRESH_TOKEN` (JWT de renovación, largo plazo).
              schema:
                type: string
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []

  # ============================================================================
  # AUTH - REFRESH
  # ============================================================================
  /auth/refresh:
    post:
      tags:
        - Autenticación
      summary: Renovar access token
      description: >
        Renueva el access token utilizando el refresh token almacenado en la
        cookie `ACAD_MGR_REFRESH_TOKEN`. Actualiza la cookie de acceso.
        El cuerpo de la respuesta no contiene datos (el nuevo token va en la cookie).
      operationId: refresh
      responses:
        "200":
          description: Token renovado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
          headers:
            Set-Cookie:
              description: Cookie ACAD_MGR_ACCESS_TOKEN actualizada
              schema:
                type: string
        "401":
          description: Refresh token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []

  # ============================================================================
  # AUTH - LOGOUT
  # ============================================================================
  /auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cerrar sesión
      description: >
        Revoca la sesión activa del usuario y elimina las cookies de
        autenticación. Requiere un access token válido.
      operationId: logout
      responses:
        "200":
          description: Sesión cerrada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: No autorizado (token inválido o sesión expirada)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  # ============================================================================
  # AUTH - FORGOT PASSWORD
  # ============================================================================
  /auth/forgot-password:
    post:
      tags:
        - Autenticación
      summary: Solicitar recuperación de contraseña
      description: >
        Envía un correo con un enlace de recuperación si el email corresponde a
        un usuario registrado. Por seguridad, la respuesta es siempre la misma
        exista o no la cuenta (evita enumeración de correos). El enlace expira
        en 30 minutos y es de un solo uso.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordDto"
      responses:
        "200":
          description: Solicitud procesada (respuesta genérica)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
      security: []

  # ============================================================================
  # AUTH - RESET PASSWORD
  # ============================================================================
  /auth/reset-password:
    post:
      tags:
        - Autenticación
      summary: Restablecer contraseña
      description: >
        Define una nueva contraseña a partir del token enviado por correo.
        El token es de un solo uso: queda inválido tras usarse o si la
        contraseña cambia. Al restablecerla se revocan todas las sesiones
        activas del usuario.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordDto"
      responses:
        "200":
          description: Contraseña actualizada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          description: Token inválido/expirado o error de validación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security: []

  # ============================================================================
  # USERS - LIST
  # ============================================================================
  /users:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      description: >
        Obtiene un listado de todos los usuarios del sistema.
        Soporta filtros opcionales por texto de búsqueda y rol.
      operationId: listUsers
      parameters:
        - name: search
          in: query
          description: Búsqueda por email o nombre (ILIKE)
          required: false
          schema:
            type: string
            maxLength: 255
          example: admin
        - name: role
          in: query
          description: Filtrar por rol
          required: false
          schema:
            $ref: "#/components/schemas/UserRole"
      responses:
        "200":
          description: Listado de usuarios obtenido exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserView"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

    post:
      tags:
        - Usuarios
      summary: Crear usuario
      description: >
        Crea un nuevo usuario en el sistema con los datos proporcionados.
        La contraseña debe cumplir con los requisitos de seguridad mínimos.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserDto"
      responses:
        "201":
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserView"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  # ============================================================================
  # USERS - GET BY ID
  # ============================================================================
  /users/{id}:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario por ID
      description: Obtiene un usuario específico mediante su UUID.
      operationId: getUser
      parameters:
        - name: id
          in: path
          description: UUID del usuario
          required: true
          schema:
            type: string
            format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        "200":
          description: Usuario encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserView"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

    put:
      tags:
        - Usuarios
      summary: Actualizar usuario
      description: >
        Actualiza parcialmente un usuario. Todos los campos son opcionales;
        solo se actualizan los campos proporcionados. Si se envía `password`,
        debe cumplir con los requisitos de seguridad mínimos.
      operationId: updateUser
      parameters:
        - name: id
          in: path
          description: UUID del usuario
          required: true
          schema:
            type: string
            format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        "200":
          description: Usuario actualizado exitosamente
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserView"
        "400":
          description: Error de validación en los datos de entrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario
      description: Elimina un usuario del sistema.
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          description: UUID del usuario
          required: true
          schema:
            type: string
            format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        "200":
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

  # ============================================================================
  # USERS - ME
  # ============================================================================
  /users/me:
    get:
      tags:
        - Usuarios
      summary: Obtener usuario actual
      description: >
        Obtiene los datos del usuario autenticado mediante su sesión activa.
      operationId: getMe
      responses:
        "200":
          description: Datos del usuario autenticado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserView"
        "401":
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
        - CookieAuth: []

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: ACAD_MGR_ACCESS_TOKEN
      description: >
        Cookie HTTP-only que contiene el JWT de acceso.
        Se obtiene automáticamente al iniciar sesión.

  schemas:
    # ==========================================================================
    # USER ROLE
    # ==========================================================================
    UserRole:
      description: Roles de usuario del sistema
      type: string
      enum:
        - admin
      example: admin

    # ==========================================================================
    # USER VIEW
    # ==========================================================================
    UserView:
      description: Vista pública de un usuario (sin datos sensibles)
      type: object
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
          description: UUID único del usuario
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        name:
          type: string
          description: Nombre completo del usuario
          minLength: 1
          maxLength: 255
          example: Admin
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: admin@example.com
        role:
          $ref: "#/components/schemas/UserRole"

    # ==========================================================================
    # LOGIN DTO
    # ==========================================================================
    LoginDto:
      description: Credenciales de inicio de sesión
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: Correo electrónico del usuario
          minLength: 1
          maxLength: 255
          example: admin@example.com
        password:
          type: string
          format: password
          description: Contraseña del usuario
          minLength: 1
          maxLength: 255
          example: "MyStr0ng!Pass"

    # ==========================================================================
    # FORGOT PASSWORD DTO
    # ==========================================================================
    ForgotPasswordDto:
      description: Correo electrónico para solicitar la recuperación de contraseña
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Correo electrónico del usuario registrado
          example: admin@example.com

    # ==========================================================================
    # RESET PASSWORD DTO
    # ==========================================================================
    ResetPasswordDto:
      description: Token de recuperación y nueva contraseña
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: Token de recuperación recibido por correo
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        password:
          type: string
          format: password
          description: >
            Nueva contraseña. Debe tener al menos 8 caracteres, incluyendo
            una mayúscula, una minúscula, un número y un carácter especial.
          minLength: 8
          maxLength: 255
          example: "MyStr0ng!Pass"

    # ==========================================================================
    # CREATE USER DTO
    # ==========================================================================
    CreateUserDto:
      description: Datos de entrada para crear un usuario
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
          description: Nombre completo del usuario
          minLength: 1
          maxLength: 255
          example: Nuevo Usuario
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: nuevo@example.com
        password:
          type: string
          format: password
          description: >
            Contraseña del usuario. Debe tener al menos 8 caracteres,
            incluyendo una mayúscula, una minúscula, un número y un carácter especial.
          minLength: 8
          maxLength: 255
          example: "MyStr0ng!Pass"
        role:
          $ref: "#/components/schemas/UserRole"

    # ==========================================================================
    # UPDATE USER DTO
    # ==========================================================================
    UpdateUserDto:
      description: >
        Datos de entrada para actualizar un usuario. Todos los campos son
        opcionales; solo se actualizan los campos proporcionados.
      type: object
      properties:
        name:
          type: string
          description: Nombre completo del usuario
          minLength: 1
          maxLength: 255
          example: Nuevo Nombre
        email:
          type: string
          format: email
          description: Correo electrónico del usuario
          example: nuevo@example.com
        role:
          $ref: "#/components/schemas/UserRole"
        password:
          type: string
          format: password
          description: >
            Nueva contraseña. Debe tener al menos 8 caracteres, incluyendo
            una mayúscula, una minúscula, un número y un carácter especial.
          minLength: 8
          maxLength: 255
          example: "MyStr0ng!Pass"

    # ==========================================================================
    # COMMON RESPONSE ENVELOPE
    # ==========================================================================
    ApiResponse:
      description: Envelope estándar de respuesta del API
      type: object
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
          example: true
        code:
          type: integer
          description: Código de estado HTTP
          example: 200
        message:
          type: string
          description: Mensaje descriptivo de la operación
          example: "OK"
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo de la respuesta (RFC3339)
          example: "2026-06-21T18:45:00Z"

    # ==========================================================================
    # COMMON ERROR SCHEMAS
    # ==========================================================================
    ErrorResponse:
      description: Error estándar del API
      type: object
      required:
        - success
        - code
        - message
        - timestamp
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          description: Código de estado HTTP
          example: 401
        message:
          type: string
          description: Mensaje descriptivo del error
          example: "Las credenciales de acceso son inválidas"
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo de la respuesta (RFC3339)
          example: "2026-06-21T18:45:00Z"
        error:
          description: Detalle adicional del error (opcional)
          example: "Invalid credentials"

    ValidationError:
      description: Error de validación en los datos de entrada
      type: object
      required:
        - success
        - code
        - message
        - timestamp
        - errors
      properties:
        success:
          type: boolean
          example: false
        code:
          type: integer
          description: Código de estado HTTP
          example: 400
        message:
          type: string
          description: Mensaje de error general
          example: "Validation error"
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo de la respuesta (RFC3339)
          example: "2026-06-21T18:45:00Z"
        errors:
          type: object
          description: Errores de validación agrupados por campo
          additionalProperties:
            type: array
            items:
              type: object
              required:
                - code
                - message
              properties:
                code:
                  type: string
                  description: Código del error de validación
                  example: invalid
                message:
                  type: string
                  description: Descripción del error de validación
                  example: "El atributo 'email' debe ser un correo electrónico válido"
          example:
            email:
              - code: invalid
                message: "El atributo 'email' debe ser un correo electrónico válido"